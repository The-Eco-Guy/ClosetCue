services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: closetcue-disposable-test-only
    volumes:
      - database:/var/lib/mysql
      - ../../sql/closetcue_db.sql:/docker-entrypoint-initdb.d/closetcue.sql:ro
    healthcheck:
      # The bootstrap server answers socket pings before the seed import finishes.
      # Wait for the final TCP server and the application schema instead.
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u root -e "SELECT 1 FROM closetcue_retro_db.garments LIMIT 1"']
      interval: 3s
      timeout: 3s
      retries: 60
  web:
    build: .
    ports:
      - '127.0.0.1:18083:80'
    environment:
      CLOSETCUE_DB_HOST: db
      CLOSETCUE_DB_USER: root
      CLOSETCUE_DB_PASSWORD: closetcue-disposable-test-only
      CLOSETCUE_DB_NAME: closetcue_retro_db
    volumes:
      - ../../:/var/www/html/project_2nd_try:ro
      - ../../uploads:/sample-photos:ro
      - photos:/var/www/html/project_2nd_try/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  photos:
